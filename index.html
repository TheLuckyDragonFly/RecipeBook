<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Crêpes — Mode cuisine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --slate-deep: #1D1724;
    --slate-panel: #292133;
    --slate-panel-2: #3B2B42;
    --slate-line: #503A54;
    --chalk: #F4EFE4;
    --chalk-dim: #C0B7C4;
    --brass: #9FC388;
    --brass-dim: #8EAD71;
    --herb: #A186B5;
    --font-display: "Fraunces", serif;
    --font-body: "Inter", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--slate-deep);
    color: var(--chalk);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% 0%, rgba(211,162,74,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(147,181,126,0.06), transparent 60%),
      var(--slate-deep);
  }

  .app{ height: 100vh; height: 100dvh; display: flex; flex-direction: row; }

  /* ---------- RAIL ---------- */
  .rail{
    width: 300px;
    flex-shrink: 0;
    background: var(--slate-panel);
    border-right: 1px solid var(--slate-line);
    padding: clamp(16px, 3vh, 30px) 22px;
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 3vh, 30px);
    overflow-y: auto;
  }

  .eyebrow{
    margin: 0 0 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
  }

  .recipe-title{
    margin: 0;
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(22px, 2.6vw, 30px);
    line-height: 1.1;
    letter-spacing: -0.01em;
  }

  .field-label{
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin-bottom: 10px;
  }

  .portion-btn{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--slate-line);
    background: var(--slate-panel-2);
    color: var(--chalk);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .portion-btn:active{ transform: scale(0.92); }
  .portion-btn:hover{ background: var(--brass-dim); }

  .portions-readout{ display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .portions-value{ font-family: var(--font-mono); font-weight: 600; font-size: 22px; color: var(--brass); }
  .portions-unit{ font-family: var(--font-mono); font-size: 10px; color: var(--chalk-dim); letter-spacing: 0.08em; margin-top: 2px; }

  /* Step ingredients (rail) */
  .step-ingredients{ flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .ingredient-list{
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 8px;
    overflow-y: auto;
  }
  .ingredient-row{
    display: flex; align-items: baseline; gap: 9px;
    background: var(--slate-panel-2);
    border: 1px solid var(--slate-line);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    animation: rowIn 0.3s ease both;
  }
  @keyframes rowIn{ from{ opacity:0; transform: translateY(4px);} to{ opacity:1; transform: translateY(0);} }
  .ingredient-dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--herb); flex-shrink: 0; }
  .ingredient-qty{ font-family: var(--font-mono); color: var(--brass); font-weight: 600; white-space: nowrap; }
  .ingredient-name{ color: var(--chalk); }
  .ingredient-empty{ font-size: 13px; color: var(--chalk-dim); font-style: italic; padding: 8px 2px; }

  /* ---------- STAGE ---------- */
  .stage{ position: relative; flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column; }

  .step-counter{
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--chalk-dim);
    padding: clamp(16px, 3vh, 28px) clamp(24px, 4vw, 56px) 0;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .step-counter.is-hidden{ opacity: 0; visibility: hidden; }

  .mini-progress{
    width: 64px;
    height: 4px;
    border-radius: 999px;
    background: var(--slate-line);
    overflow: hidden;
  }
  .mini-progress-fill{
    display: block;
    height: 100%;
    background: var(--brass);
    border-radius: inherit;
    transition: width 0.3s ease;
  }

  .step-track{ flex: 1 1 auto; display: flex; height: 100%; will-change: transform; }
  .step-track.dragging{ transition: none !important; }
  .step-track.settle{ transition: transform 0.38s cubic-bezier(.22,.8,.4,1); }

  .step-slide{
    flex: 0 0 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 clamp(24px, 4vw, 56px) clamp(24px,4vh,40px);
    user-select: none;
  }

  .portions-slide{ align-items: center; text-align: center; }
  .portions-dial{ display: flex; align-items: center; gap: 22px; margin: 14px auto 0; }
  .portions-dial .portion-btn{ width: 54px; height: 54px; font-size: 26px; }
  .portions-dial .portions-value{ font-size: 46px; }
  .portions-hint{
    margin-top: 22px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--chalk-dim);
  }

  .step-number{ font-family: var(--font-mono); font-size: 15px; color: var(--brass); margin-bottom: 6px; }

  .step-title{
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: clamp(24px, 3.6vw, 40px);
    line-height: 1.08;
    margin: 0 0 clamp(14px, 2.4vh, 26px);
    max-width: 22ch;
  }
  .portions-slide .step-title{ max-width: none; }

  .step-content{
    font-family: var(--font-body);
    font-weight: 400;
    font-size: clamp(19px, 2.4vw, 28px);
    line-height: 1.5;
    color: var(--chalk);
    max-width: 46ch;
  }

  .ing{ color: var(--herb); font-weight: 600; white-space: nowrap; }

  .timer-chip{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: clamp(16px, 2.6vh, 26px);
    background: var(--slate-panel);
    border: 1px solid var(--slate-line);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--brass);
    width: fit-content;
  }
  .chip-icon{ width: 18px; height: 18px; display: flex; flex-shrink: 0; }
  .chip-icon svg{ width: 100%; height: 100%; }
  .chip-sep{ opacity: 0.45; }
  .chip-context{ color: var(--chalk-dim); font-weight: 500; }

  /* Nav buttons */
  .nav-btn{
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--slate-line);
    background: rgba(33, 51, 46, 0.85);
    backdrop-filter: blur(4px);
    color: var(--chalk);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s ease, background 0.15s ease;
    z-index: 5;
  }
  .nav-btn:hover{ background: var(--brass-dim); }
  .nav-btn:disabled{ opacity: 0.25; cursor: default; }
  .nav-prev{ left: clamp(10px, 2vw, 22px); }
  .nav-next{ right: clamp(10px, 2vw, 22px); }

  .swipe-hint{
    position: absolute;
    bottom: clamp(12px, 2.4vh, 22px);
    left: 0; right: 0;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--chalk-dim);
    opacity: 0.6;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .swipe-hint.is-hidden{ opacity: 0; }

  @media (max-width: 720px){
    .app{ flex-direction: column; }
    .rail{
      width: 100%;
      flex-direction: row;
      align-items: center;
      flex-wrap: wrap;
      row-gap: 12px;
      padding: 14px 18px;
      border-right: none;
      border-bottom: 1px solid var(--slate-line);
    }
    .recipe-title{ font-size: 18px; }
    .step-ingredients{ width: 100%; }
    .ingredient-list{ flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
    .step-title{ max-width: none; }
    .step-content{ max-width: none; }
  }

  @media (prefers-reduced-motion: reduce){
    .step-track{ transition: none !important; }
    .ingredient-row{ animation: none; }
  }
</style>
</head>
<body>

<div class="app" id="app">

  <aside class="rail">
    <div>
      <p class="eyebrow">Recette</p>
      <h1 class="recipe-title" id="recipeTitle">Crêpes</h1>
    </div>

    <div class="step-ingredients">
      <span class="field-label" id="ingredientsLabel">Pour cette étape</span>
      <ul class="ingredient-list" id="stepIngredientList"></ul>
    </div>
  </aside>

  <main class="stage">
    <div class="step-counter" id="stepCounter">
      <span id="stepCounterText">Étape 1 / 5</span>
      <span class="mini-progress"><span class="mini-progress-fill" id="miniProgressFill"></span></span>
    </div>

    <button class="nav-btn nav-prev" id="navPrev" aria-label="Étape précédente">←</button>
    <button class="nav-btn nav-next" id="navNext" aria-label="Étape suivante">→</button>

    <div class="step-track settle" id="stepTrack"></div>

    <div class="swipe-hint" id="swipeHint">glisser pour changer d'étape</div>
  </main>

</div>

<script>
(function(){

  // ---------- ICÔNES DE CONTEXTE ----------
  const icons = {
    default: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.2"/><path d="M10 6v4.2l3 2"/></svg>',
    four: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="1.4"/><line x1="3" y1="7.2" x2="17" y2="7.2"/><circle cx="6" cy="5.1" r="0.55" fill="currentColor" stroke="none"/><circle cx="9" cy="5.1" r="0.55" fill="currentColor" stroke="none"/><rect x="5.4" y="9.6" width="9.2" height="5.4" rx="1"/></svg>',
    plaque: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3.4"/></svg>',
    casserole: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.6" y="7.4" width="12.8" height="7.6" rx="1.3"/><line x1="3.6" y1="7.4" x2="16.4" y2="7.4"/><line x1="1.6" y1="9.4" x2="3.6" y2="9.4"/><line x1="16.4" y1="9.4" x2="18.4" y2="9.4"/></svg>',
    poele: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.2" cy="10.4" r="5.8"/><line x1="13.4" y1="8.2" x2="18.6" y2="6"/></svg>',
    ambiante: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 3.6a1.9 1.9 0 0 0-1.9 1.9v7.3a2.9 2.9 0 1 0 3.8 0V5.5a1.9 1.9 0 0 0-1.9-1.9z"/><line x1="10.2" y1="6.4" x2="10.2" y2="11.2"/></svg>',
    frigo: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4.4" y="2.4" width="11.2" height="15.2" rx="1.3"/><line x1="4.4" y1="8" x2="15.6" y2="8"/><line x1="6.6" y1="4.4" x2="6.6" y2="6.2"/><line x1="6.6" y1="9.8" x2="6.6" y2="12.6"/></svg>',
    congelateur: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="3" x2="10" y2="17"/><line x1="3.6" y1="6.5" x2="16.4" y2="13.5"/><line x1="16.4" y1="6.5" x2="3.6" y2="13.5"/><path d="M8 5l2-2 2 2"/><path d="M8 15l2 2 2-2"/></svg>'
  };
  const contextLabels = {
    four: "four", plaque: "plaque", casserole: "casserole", poele: "poêle",
    ambiante: "température ambiante", frigo: "frigo", congelateur: "congélateur"
  };

  // ---------- DONNÉES DE LA RECETTE (exemple) ----------
  const recipe = {
    title: "Crêpes",
    baseServings: 4,
    servingsUnit: "personnes",
    ingredients: {
      farine:  { name: "farine",        amount: 250, unit: "g" },
      oeufs:   { name: "œufs",          amount: 4,   unit: null },
      lait:    { name: "lait",          amount: 500, unit: "ml" },
      beurre:  { name: "beurre fondu",  amount: 50,  unit: "g" },
      sel:     { name: "sel",           amount: 1,   unit: "pincée" },
      sucre:   { name: "sucre",         amount: 2,   unit: "c. à soupe" },
    },
    steps: [
      {
        title: "Mélanger les ingrédients secs",
        timer: null, context: null,
        parts: ["Dans un grand saladier, verser ", {ing:"farine"}, " et ", {ing:"sel"}, ". Creuser un puits au centre."]
      },
      {
        title: "Ajouter les œufs",
        timer: null, context: null,
        parts: ["Casser ", {ing:"oeufs"}, " dans le puits, puis commencer à mélanger avec un fouet en partant du centre."]
      },
      {
        title: "Détendre la pâte",
        timer: null, context: null,
        parts: ["Verser ", {ing:"lait"}, " petit à petit tout en fouettant, jusqu'à obtenir une pâte lisse et sans grumeaux."]
      },
      {
        title: "Parfumer et reposer",
        timer: 1800, context: "ambiante",
        parts: ["Incorporer ", {ing:"beurre"}, " et ", {ing:"sucre"}, ". Laisser reposer la pâte à température ambiante."]
      },
      {
        title: "Cuire les crêpes",
        timer: 120, context: "poele",
        parts: ["Chauffer une poêle beurrée, verser une louche de pâte en inclinant la poêle. Cuire environ 1 à 2 minutes par face."]
      }
    ]
  };

  // ---------- ÉTAT ----------
  // current = 0 -> pré-étape "portions" ; current 1..N -> étapes de la recette
  let servings = recipe.baseServings;
  let current = 0;
  const stepsTotal = recipe.steps.length;
  const slideCount = stepsTotal + 1;

  // ---------- UTILITAIRES ----------
  function scaledAmount(base){
    const raw = base * servings / recipe.baseServings;
    const rounded10 = Math.round(raw * 10) / 10;
    if (Math.abs(rounded10 - Math.round(rounded10)) < 0.001) {
      return Math.round(rounded10).toString();
    }
    return rounded10.toString().replace(".", ",");
  }

  function isVowelSound(name){
    const first = name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").charAt(0).toLowerCase();
    return "aeiouyh".includes(first);
  }

  // Pour les puces de la colonne latérale : "250 g" / "4"
  function chipAmount(key){
    const ing = recipe.ingredients[key];
    const qty = scaledAmount(ing.amount);
    return ing.unit ? `${qty} ${ing.unit}` : qty;
  }

  // Pour une phrase grammaticalement correcte dans le texte d'une étape
  function inlinePhrase(key){
    const ing = recipe.ingredients[key];
    const qty = scaledAmount(ing.amount);
    if (!ing.unit) return `${qty} ${ing.name}`;
    const connector = isVowelSound(ing.name) ? "d\u2019" : "de ";
    return `${qty} ${ing.unit} ${connector}${ing.name}`;
  }

  function formatTimer(seconds){
    if (!seconds) return null;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    if (m && s) return `${m} min ${s}s`;
    if (m) return `${m} min`;
    return `${s}s`;
  }

  // ---------- RENDU : PISTE DES ÉTAPES ----------
  const track = document.getElementById("stepTrack");

  function buildPortionsSlide(){
    const slide = document.createElement("div");
    slide.className = "step-slide portions-slide";
    slide.innerHTML = `
      <div class="step-number">Avant de commencer</div>
      <h2 class="step-title">Combien de personnes ?</h2>
      <div class="portions-dial">
        <button class="portion-btn" id="portionsMinus" aria-label="Moins de portions">−</button>
        <div class="portions-readout">
          <span class="portions-value" id="portionsValue">${servings}</span>
          <span class="portions-unit">${recipe.servingsUnit}</span>
        </div>
        <button class="portion-btn" id="portionsPlus" aria-label="Plus de portions">+</button>
      </div>
      <div class="portions-hint">glisse ou appuie sur → pour commencer</div>
    `;
    return slide;
  }

  function buildStepSlide(step, i){
    const slide = document.createElement("div");
    slide.className = "step-slide";

    const num = document.createElement("div");
    num.className = "step-number";
    num.textContent = String(i + 1).padStart(2, "0");
    slide.appendChild(num);

    const title = document.createElement("h2");
    title.className = "step-title";
    title.textContent = step.title;
    slide.appendChild(title);

    const content = document.createElement("p");
    content.className = "step-content";
    step.parts.forEach(part => {
      if (typeof part === "string") {
        content.appendChild(document.createTextNode(part));
      } else if (part.ing) {
        const span = document.createElement("span");
        span.className = "ing";
        span.dataset.ing = part.ing;
        span.textContent = inlinePhrase(part.ing);
        content.appendChild(span);
      }
    });
    slide.appendChild(content);

    if (step.timer){
      const chip = document.createElement("div");
      chip.className = "timer-chip";

      const iconSpan = document.createElement("span");
      iconSpan.className = "chip-icon";
      iconSpan.innerHTML = icons[step.context] || icons.default;
      chip.appendChild(iconSpan);

      const timeSpan = document.createElement("span");
      timeSpan.className = "chip-time";
      timeSpan.textContent = formatTimer(step.timer);
      chip.appendChild(timeSpan);

      if (step.context && contextLabels[step.context]){
        const sep = document.createElement("span");
        sep.className = "chip-sep";
        sep.textContent = "·";
        chip.appendChild(sep);

        const ctx = document.createElement("span");
        ctx.className = "chip-context";
        ctx.textContent = contextLabels[step.context];
        chip.appendChild(ctx);
      }
      slide.appendChild(chip);
    }

    return slide;
  }

  function buildSlides(){
    track.innerHTML = "";
    track.appendChild(buildPortionsSlide());
    recipe.steps.forEach((step, i) => track.appendChild(buildStepSlide(step, i)));
  }

  function refreshIngredientText(){
    document.querySelectorAll(".ing").forEach(span => {
      span.textContent = inlinePhrase(span.dataset.ing);
    });
    const bigValue = document.getElementById("portionsValue");
    if (bigValue) bigValue.textContent = servings;
  }

  // ---------- RENDU : BARRE LATÉRALE + EN-TÊTE ----------
  const stepCounterEl = document.getElementById("stepCounter");
  const stepCounterText = document.getElementById("stepCounterText");
  const miniProgressFill = document.getElementById("miniProgressFill");
  const ingredientsLabelEl = document.getElementById("ingredientsLabel");
  const ingredientListEl = document.getElementById("stepIngredientList");
  const swipeHintEl = document.getElementById("swipeHint");

  function renderIngredientRows(keys){
    ingredientListEl.innerHTML = "";
    if (keys.length === 0){
      const li = document.createElement("li");
      li.className = "ingredient-empty";
      li.textContent = "Aucun ingrédient à cette étape";
      ingredientListEl.appendChild(li);
      return;
    }
    keys.forEach(key => {
      const ing = recipe.ingredients[key];
      const li = document.createElement("li");
      li.className = "ingredient-row";
      li.innerHTML = `<span class="ingredient-dot"></span><span class="ingredient-qty">${chipAmount(key)}</span><span class="ingredient-name">${ing.name}</span>`;
      ingredientListEl.appendChild(li);
    });
  }

  function renderRail(){
    if (current === 0){
      ingredientsLabelEl.textContent = "Tous les ingrédients";
      renderIngredientRows(Object.keys(recipe.ingredients));
    } else {
      ingredientsLabelEl.textContent = "Pour cette étape";
      const step = recipe.steps[current - 1];
      const keys = step.parts.filter(p => p && p.ing).map(p => p.ing);
      renderIngredientRows(keys);
    }
  }

  function renderHeader(){
    const onPortions = current === 0;
    stepCounterEl.classList.toggle("is-hidden", onPortions);
    swipeHintEl.classList.toggle("is-hidden", onPortions);
    if (!onPortions){
      stepCounterText.textContent = `Étape ${current} / ${stepsTotal}`;
      miniProgressFill.style.width = `${(current / stepsTotal) * 100}%`;
    }
  }

  function renderMeta(){
    renderHeader();
    renderRail();
  }

  // ---------- NAVIGATION ----------
  const navPrev = document.getElementById("navPrev");
  const navNext = document.getElementById("navNext");

  function goTo(index, animate = true){
    current = Math.max(0, Math.min(slideCount - 1, index));
    track.classList.toggle("settle", animate);
    track.style.transform = `translateX(-${current * 100}%)`;
    navPrev.disabled = current === 0;
    navNext.disabled = current === slideCount - 1;
    renderMeta();
  }

  navPrev.addEventListener("click", () => goTo(current - 1));
  navNext.addEventListener("click", () => goTo(current + 1));

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") goTo(current + 1);
    if (e.key === "ArrowLeft") goTo(current - 1);
  });

  // ---------- PORTIONS ----------
  function bindPortionButtons(){
    document.getElementById("portionsMinus").addEventListener("click", () => {
      servings = Math.max(1, servings - 1);
      refreshIngredientText();
      renderRail();
    });
    document.getElementById("portionsPlus").addEventListener("click", () => {
      servings = Math.min(24, servings + 1);
      refreshIngredientText();
      renderRail();
    });
  }

  // ---------- BALAYAGE (SWIPE) ----------
  let startX = 0, deltaX = 0, dragging = false, stageWidth = 1;

  function onStart(x){
    dragging = true;
    startX = x;
    deltaX = 0;
    stageWidth = track.parentElement.getBoundingClientRect().width || 1;
    track.classList.remove("settle");
    track.classList.add("dragging");
  }
  function onMove(x){
    if (!dragging) return;
    deltaX = x - startX;
    const base = -current * stageWidth;
    track.style.transform = `translateX(${base + deltaX}px)`;
  }
  function onEnd(){
    if (!dragging) return;
    dragging = false;
    track.classList.remove("dragging");
    const threshold = stageWidth * 0.16;
    if (deltaX < -threshold && current < slideCount - 1) {
      goTo(current + 1);
    } else if (deltaX > threshold && current > 0) {
      goTo(current - 1);
    } else {
      goTo(current);
    }
  }

  track.addEventListener("touchstart", (e) => onStart(e.touches[0].clientX), { passive: true });
  track.addEventListener("touchmove", (e) => onMove(e.touches[0].clientX), { passive: true });
  track.addEventListener("touchend", onEnd);

  let mouseDown = false;
  track.addEventListener("mousedown", (e) => { mouseDown = true; onStart(e.clientX); });
  window.addEventListener("mousemove", (e) => { if (mouseDown) onMove(e.clientX); });
  window.addEventListener("mouseup", () => { if (mouseDown) { mouseDown = false; onEnd(); } });

  window.addEventListener("resize", () => goTo(current, false));

  // ---------- INITIALISATION ----------
  document.getElementById("recipeTitle").textContent = recipe.title;
  buildSlides();
  bindPortionButtons();
  goTo(0, false);

})();
</script>

</body>
</html>
