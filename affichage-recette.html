<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Crêpes — Mode cuisine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --slate-deep: #172420;
    --slate-panel: #21332e;
    --slate-panel-2: #2b423b;
    --slate-line: #3a544c;
    --chalk: #f4efe4;
    --chalk-dim: #b7c4bc;
    --brass: #d3a24a;
    --brass-dim: #a8863e;
    --herb: #93b57e;
    --shadow: rgba(6, 12, 10, 0.45);
    --font-display: "Fraunces", serif;
    --font-body: "Inter", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--slate-deep);
    color: var(--chalk);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% 0%, rgba(211,162,74,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(147,181,126,0.06), transparent 60%),
      var(--slate-deep);
  }

  .app{
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: row;
  }

  /* ---------- RAIL ---------- */
  .rail{
    width: 300px;
    flex-shrink: 0;
    background: var(--slate-panel);
    border-right: 1px solid var(--slate-line);
    padding: clamp(16px, 3vh, 30px) 22px;
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 3vh, 30px);
    overflow-y: auto;
  }

  .eyebrow{
    margin: 0 0 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
  }

  .recipe-title{
    margin: 0;
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(22px, 2.6vw, 30px);
    line-height: 1.1;
    letter-spacing: -0.01em;
  }

  .field-label{
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin-bottom: 10px;
  }

  /* Portions dial */
  .portions-control{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--slate-deep);
    border: 1px solid var(--slate-line);
    border-radius: 999px;
    padding: 6px;
  }

  .portion-btn{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--slate-line);
    background: var(--slate-panel-2);
    color: var(--chalk);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .portion-btn:active{ transform: scale(0.92); }
  .portion-btn:hover{ background: var(--brass-dim); }

  .portions-readout{
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }
  .portions-value{
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 22px;
    color: var(--brass);
  }
  .portions-unit{
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--chalk-dim);
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  /* Step ingredients */
  .step-ingredients{ flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .ingredient-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  .ingredient-row{
    display: flex;
    align-items: baseline;
    gap: 9px;
    background: var(--slate-panel-2);
    border: 1px solid var(--slate-line);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    animation: rowIn 0.3s ease both;
  }
  @keyframes rowIn{ from{ opacity:0; transform: translateY(4px);} to{ opacity:1; transform: translateY(0);} }
  .ingredient-dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--herb);
    flex-shrink: 0;
  }
  .ingredient-qty{
    font-family: var(--font-mono);
    color: var(--brass);
    font-weight: 600;
    white-space: nowrap;
  }
  .ingredient-name{ color: var(--chalk); }
  .ingredient-empty{
    font-size: 13px;
    color: var(--chalk-dim);
    font-style: italic;
    padding: 8px 2px;
  }

  /* Progress ticks */
  .progress{ flex-shrink: 0; }
  .progress-ticks{
    display: flex;
    gap: 5px;
    align-items: flex-end;
    height: 26px;
  }
  .tick{
    flex: 1;
    height: 10px;
    border-radius: 2px;
    background: var(--slate-line);
    transition: height 0.25s ease, background 0.25s ease, transform 0.25s ease;
  }
  .tick.done{ background: var(--herb); opacity: 0.55; }
  .tick.active{ background: var(--brass); height: 22px; }

  /* ---------- STAGE ---------- */
  .stage{
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .step-counter{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--chalk-dim);
    padding: clamp(16px, 3vh, 28px) clamp(24px, 4vw, 56px) 0;
  }

  .step-track{
    flex: 1 1 auto;
    display: flex;
    height: 100%;
    will-change: transform;
  }
  .step-track.dragging{ transition: none !important; }
  .step-track.settle{ transition: transform 0.38s cubic-bezier(.22,.8,.4,1); }

  .step-slide{
    flex: 0 0 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 clamp(24px, 4vw, 56px) clamp(24px,4vh,40px);
    user-select: none;
  }

  .step-number{
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--brass);
    margin-bottom: 6px;
  }

  .step-title{
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: clamp(24px, 3.6vw, 40px);
    line-height: 1.08;
    margin: 0 0 clamp(14px, 2.4vh, 26px);
    max-width: 22ch;
  }

  .step-content{
    font-family: var(--font-body);
    font-weight: 400;
    font-size: clamp(19px, 2.4vw, 28px);
    line-height: 1.5;
    color: var(--chalk);
    max-width: 46ch;
  }

  .ing{
    color: var(--herb);
    font-weight: 600;
    white-space: nowrap;
  }

  .timer-chip{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: clamp(16px, 2.6vh, 26px);
    background: var(--slate-panel);
    border: 1px solid var(--slate-line);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--brass);
    width: fit-content;
  }

  /* Nav buttons */
  .nav-btn{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--slate-line);
    background: rgba(33, 51, 46, 0.85);
    backdrop-filter: blur(4px);
    color: var(--chalk);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease, background 0.15s ease;
    z-index: 5;
  }
  .nav-btn:hover{ background: var(--brass-dim); }
  .nav-btn:disabled{ opacity: 0.25; cursor: default; }
  .nav-prev{ left: clamp(10px, 2vw, 22px); }
  .nav-next{ right: clamp(10px, 2vw, 22px); }

  .swipe-hint{
    position: absolute;
    bottom: clamp(12px, 2.4vh, 22px);
    left: 0; right: 0;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--chalk-dim);
    opacity: 0.6;
    pointer-events: none;
  }

  @media (max-width: 720px){
    .app{ flex-direction: column; }
    .rail{
      width: 100%;
      flex-direction: row;
      align-items: center;
      flex-wrap: wrap;
      row-gap: 12px;
      padding: 14px 18px;
      border-right: none;
      border-bottom: 1px solid var(--slate-line);
    }
    .recipe-title{ font-size: 18px; }
    .step-ingredients{ order: 4; width: 100%; }
    .ingredient-list{ flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
    .progress{ order: 3; width: 100%; }
    .step-title{ max-width: none; }
    .step-content{ max-width: none; }
  }

  @media (prefers-reduced-motion: reduce){
    .step-track{ transition: none !important; }
    .ingredient-row{ animation: none; }
  }
</style>
</head>
<body>

<div class="app" id="app">

  <aside class="rail">
    <div>
      <p class="eyebrow">Recette</p>
      <h1 class="recipe-title" id="recipeTitle">Crêpes</h1>
    </div>

    <div>
      <span class="field-label">Portions</span>
      <div class="portions-control">
        <button class="portion-btn" id="portionsMinus" aria-label="Moins de portions">−</button>
        <div class="portions-readout">
          <span class="portions-value" id="portionsValue">4</span>
          <span class="portions-unit">personnes</span>
        </div>
        <button class="portion-btn" id="portionsPlus" aria-label="Plus de portions">+</button>
      </div>
    </div>

    <div class="step-ingredients">
      <span class="field-label">Pour cette étape</span>
      <ul class="ingredient-list" id="stepIngredientList"></ul>
    </div>

    <div class="progress">
      <span class="field-label">Progression</span>
      <div class="progress-ticks" id="progressTicks"></div>
    </div>
  </aside>

  <main class="stage">
    <div class="step-counter" id="stepCounter">Étape 1 / 5</div>

    <button class="nav-btn nav-prev" id="navPrev" aria-label="Étape précédente">←</button>
    <button class="nav-btn nav-next" id="navNext" aria-label="Étape suivante">→</button>

    <div class="step-track settle" id="stepTrack"></div>

    <div class="swipe-hint">glisser pour changer d'étape</div>
  </main>

</div>

<script>
(function(){

  // ---------- DONNÉES DE LA RECETTE (exemple) ----------
  const recipe = {
    title: "Crêpes",
    baseServings: 4,
    servingsUnit: "personnes",
    ingredients: {
      farine:  { name: "farine",        amount: 250, unit: "g" },
      oeufs:   { name: "œufs",          amount: 4,   unit: null },
      lait:    { name: "lait",          amount: 500, unit: "ml" },
      beurre:  { name: "beurre fondu",  amount: 50,  unit: "g" },
      sel:     { name: "sel",           amount: 1,   unit: "pincée" },
      sucre:   { name: "sucre",         amount: 2,   unit: "c. à soupe" },
    },
    steps: [
      {
        title: "Mélanger les ingrédients secs",
        timer: null,
        parts: ["Dans un grand saladier, verser la ", {ing:"farine"}, " et la ", {ing:"sel"}, ". Creuser un puits au centre."]
      },
      {
        title: "Ajouter les œufs",
        timer: null,
        parts: ["Casser les ", {ing:"oeufs"}, " dans le puits, puis commencer à mélanger avec un fouet en partant du centre."]
      },
      {
        title: "Détendre la pâte",
        timer: null,
        parts: ["Verser le ", {ing:"lait"}, " petit à petit tout en fouettant, jusqu'à obtenir une pâte lisse et sans grumeaux."]
      },
      {
        title: "Parfumer et reposer",
        timer: 1800,
        parts: ["Incorporer le ", {ing:"beurre"}, " fondu et le ", {ing:"sucre"}, ". Laisser reposer la pâte à température ambiante."]
      },
      {
        title: "Cuire les crêpes",
        timer: 120,
        parts: ["Chauffer une poêle beurrée, verser une louche de pâte en inclinant la poêle. Cuire environ 1 à 2 minutes par face."]
      }
    ]
  };

  // ---------- ÉTAT ----------
  let servings = recipe.baseServings;
  let current = 0;
  const total = recipe.steps.length;

  // ---------- UTILITAIRES ----------
  function scaledAmount(base){
    const raw = base * servings / recipe.baseServings;
    const rounded10 = Math.round(raw * 10) / 10;
    if (Math.abs(rounded10 - Math.round(rounded10)) < 0.001) {
      return Math.round(rounded10).toString();
    }
    return rounded10.toString().replace(".", ",");
  }

  function formatIngredient(key){
    const ing = recipe.ingredients[key];
    const qty = scaledAmount(ing.amount);
    const unitPart = ing.unit ? `${ing.unit} ` : "";
    return { qty: `${qty} ${unitPart}`.trim(), name: ing.name };
  }

  function formatTimer(seconds){
    if (!seconds) return null;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    if (m && s) return `${m} min ${s}s`;
    if (m) return `${m} min`;
    return `${s}s`;
  }

  // ---------- RENDU : PISTE DES ÉTAPES ----------
  const track = document.getElementById("stepTrack");

  function buildSlides(){
    track.innerHTML = "";
    recipe.steps.forEach((step, i) => {
      const slide = document.createElement("div");
      slide.className = "step-slide";

      const num = document.createElement("div");
      num.className = "step-number";
      num.textContent = String(i + 1).padStart(2, "0");
      slide.appendChild(num);

      const title = document.createElement("h2");
      title.className = "step-title";
      title.textContent = step.title;
      slide.appendChild(title);

      const content = document.createElement("p");
      content.className = "step-content";
      step.parts.forEach(part => {
        if (typeof part === "string") {
          content.appendChild(document.createTextNode(part));
        } else if (part.ing) {
          const f = formatIngredient(part.ing);
          const span = document.createElement("span");
          span.className = "ing";
          span.dataset.ing = part.ing;
          span.textContent = `${f.qty} de ${f.name}`;
          content.appendChild(span);
        }
      });
      slide.appendChild(content);

      const timerLabel = formatTimer(step.timer);
      if (timerLabel){
        const chip = document.createElement("div");
        chip.className = "timer-chip";
        chip.textContent = `⏱ ${timerLabel}`;
        slide.appendChild(chip);
      }

      track.appendChild(slide);
    });
  }

  function refreshIngredientText(){
    // Met à jour les quantités déjà affichées dans les étapes sans reconstruire tout le DOM
    document.querySelectorAll(".ing").forEach(span => {
      const key = span.dataset.ing;
      const f = formatIngredient(key);
      span.textContent = `${f.qty} de ${f.name}`;
    });
  }

  // ---------- RENDU : BARRE LATÉRALE ----------
  const portionsValueEl = document.getElementById("portionsValue");
  const stepCounterEl = document.getElementById("stepCounter");
  const ingredientListEl = document.getElementById("stepIngredientList");
  const ticksEl = document.getElementById("progressTicks");

  function renderTicks(){
    ticksEl.innerHTML = "";
    for (let i = 0; i < total; i++){
      const t = document.createElement("div");
      t.className = "tick" + (i === current ? " active" : i < current ? " done" : "");
      ticksEl.appendChild(t);
    }
  }

  function renderStepIngredients(){
    const step = recipe.steps[current];
    const keys = step.parts.filter(p => p && p.ing).map(p => p.ing);
    ingredientListEl.innerHTML = "";
    if (keys.length === 0){
      const li = document.createElement("li");
      li.className = "ingredient-empty";
      li.textContent = "Aucun ingrédient à cette étape";
      ingredientListEl.appendChild(li);
      return;
    }
    keys.forEach(key => {
      const f = formatIngredient(key);
      const li = document.createElement("li");
      li.className = "ingredient-row";
      li.innerHTML = `<span class="ingredient-dot"></span><span class="ingredient-qty">${f.qty}</span><span class="ingredient-name">${f.name}</span>`;
      ingredientListEl.appendChild(li);
    });
  }

  function renderMeta(){
    portionsValueEl.textContent = servings;
    stepCounterEl.textContent = `Étape ${current + 1} / ${total}`;
    renderTicks();
    renderStepIngredients();
  }

  // ---------- NAVIGATION ----------
  const navPrev = document.getElementById("navPrev");
  const navNext = document.getElementById("navNext");

  function goTo(index, animate = true){
    current = Math.max(0, Math.min(total - 1, index));
    track.classList.toggle("settle", animate);
    track.style.transform = `translateX(-${current * 100}%)`;
    navPrev.disabled = current === 0;
    navNext.disabled = current === total - 1;
    renderMeta();
  }

  navPrev.addEventListener("click", () => goTo(current - 1));
  navNext.addEventListener("click", () => goTo(current + 1));

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") goTo(current + 1);
    if (e.key === "ArrowLeft") goTo(current - 1);
  });

  // ---------- PORTIONS ----------
  document.getElementById("portionsMinus").addEventListener("click", () => {
    servings = Math.max(1, servings - 1);
    renderMeta();
    refreshIngredientText();
  });
  document.getElementById("portionsPlus").addEventListener("click", () => {
    servings = Math.min(24, servings + 1);
    renderMeta();
    refreshIngredientText();
  });

  // ---------- BALAYAGE (SWIPE) ----------
  let startX = 0, deltaX = 0, dragging = false, stageWidth = 1;

  function onStart(x){
    dragging = true;
    startX = x;
    deltaX = 0;
    stageWidth = track.parentElement.getBoundingClientRect().width || 1;
    track.classList.remove("settle");
    track.classList.add("dragging");
  }
  function onMove(x){
    if (!dragging) return;
    deltaX = x - startX;
    const base = -current * stageWidth;
    track.style.transform = `translateX(${base + deltaX}px)`;
  }
  function onEnd(){
    if (!dragging) return;
    dragging = false;
    track.classList.remove("dragging");
    const threshold = stageWidth * 0.16;
    if (deltaX < -threshold && current < total - 1) {
      goTo(current + 1);
    } else if (deltaX > threshold && current > 0) {
      goTo(current - 1);
    } else {
      goTo(current); // rebond retour à la position actuelle
    }
  }

  track.addEventListener("touchstart", (e) => onStart(e.touches[0].clientX), { passive: true });
  track.addEventListener("touchmove", (e) => onMove(e.touches[0].clientX), { passive: true });
  track.addEventListener("touchend", onEnd);

  // Support souris (aperçu bureau)
  let mouseDown = false;
  track.addEventListener("mousedown", (e) => { mouseDown = true; onStart(e.clientX); });
  window.addEventListener("mousemove", (e) => { if (mouseDown) onMove(e.clientX); });
  window.addEventListener("mouseup", () => { if (mouseDown) { mouseDown = false; onEnd(); } });

  window.addEventListener("resize", () => goTo(current, false));

  // ---------- INITIALISATION ----------
  document.getElementById("recipeTitle").textContent = recipe.title;
  document.querySelector(".portions-unit").textContent = recipe.servingsUnit;
  buildSlides();
  goTo(0, false);

})();
</script>

</body>
</html>
